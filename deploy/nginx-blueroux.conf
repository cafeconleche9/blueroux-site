# Blue Roux archive — served on the home network at http://blueroux.local
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name blueroux.local _;      # "_" also answers to this computer's own .local name and IP

    root /var/www/blueroux;
    index index.html;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    location / {
        try_files $uri $uri/ =404;
    }

    # Pages and the album list change daily: always revalidate so people see fresh data.
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache";
    }
    location = / {
        add_header Cache-Control "no-cache";
    }

    # Fonts, images, css and js rarely change.
    location /static/ {
        add_header Cache-Control "public, max-age=86400";
    }

    location ~ /\.(?!well-known) { deny all; }
}
